services:
  server-api:
    build:
      context: .
      dockerfile: Server.Api/Dockerfile
    container_name: pc-manager-server
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Secret: CHANGE_ME_FOR_PRODUCTION_32+_CHARS_SECRET
      Agent__BaseUrl: http://host.docker.internal:8090/
      Agent__ApiKey: CHANGE_ME_AGENT_KEY
    ports:
      - "8080:8080"
    depends_on:
      - host-agent

  host-agent:
    build:
      context: .
      dockerfile: Host.Agent/Dockerfile
    container_name: pc-manager-host-agent
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8090
      Agent__ApiKey: CHANGE_ME_AGENT_KEY
    ports:
      - "8090:8090"
