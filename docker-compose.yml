# Только Server.Api. Host.Agent запускайте отдельно на управляемом ПК (dotnet run или служба),
# не в этом compose — см. docs/deployment.md
services:
  server-api:
    build:
      context: .
      dockerfile: Server.Api/Dockerfile
    container_name: pc-manager-server
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Secret: CHANGE_ME_FOR_PRODUCTION_32+_CHARS_SECRET
      # URL агента на хосте (Windows/Mac Docker Desktop). На Linux задайте IP хоста или Tailscale.
      Agent__BaseUrl: http://host.docker.internal:8090/
      Agent__ApiKey: CHANGE_ME_AGENT_KEY
    ports:
      - "8080:8080"
